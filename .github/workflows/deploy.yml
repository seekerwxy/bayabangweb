name: Deploy to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-infinityfree
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate config.local.php from secrets
        env:
          CONFIG_LOCAL_PHP: ${{ secrets.CONFIG_LOCAL_PHP }}
        run: |
          python3 - <<'PY'
          import os

          content = os.environ['CONFIG_LOCAL_PHP']
          if not content.strip():
              raise SystemExit('CONFIG_LOCAL_PHP secret is empty; add it in GitHub Settings -> Secrets')
          if not content.lstrip().startswith('<?php'):
              raise SystemExit('CONFIG_LOCAL_PHP secret must be the full content of config.local.php')

          with open('config.local.php', 'w', encoding='utf-8', newline='\n') as f:
              f.write(content)
          PY

      # 先做语法检查再部署：任何一个 PHP 文件有语法错误就直接失败，
      # 免得把整站 500 的版本推上线（`.htaccess` 出问题还能 FTP 改回去，
      # PHP 语法错误会让所有页面白屏）。
      - name: Lint PHP files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli >/dev/null
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTP 登录后根目录里同时能看到 bayabang.top/ 和 htdocs/，bayabang.top 是附加域名，
          # 它的站点根目录是 bayabang.top/htdocs/（不是 htdocs/）。
          # 不要加前导 "/"：加了会被当作 FTP 服务器根目录；路径必须落在 htdocs 内，
          # 否则 InfinityFree 会自动删除上传的文件。
          server-dir: bayabang.top/htdocs/
          state-name: .ftp-deploy-sync-state-v2.json
          # 明文 FTP 会把 config.local.php（数据库口令 + 管理员口令）暴露在公网上，
          # 这里使用 FTPS（21 端口显式 TLS）。InfinityFree 的 ftpupload.net 支持。
          # 万一 TLS 握手失败导致部署报错，可临时改回 ftp，但请尽快改回来。
          protocol: ftps
          port: 21
          # standard 会打印真实的部署路径和每个上传/删除动作，便于排查“部署了却没生效”
          log-level: standard
          # 排除规则用 gitignore 语法；下面这段是纯 glob，不放注释（注释写在 YAML 里，
          # 免得被当成匹配式）。同学上传的头像只存在服务器上，必须把所有可能的后缀
          # （jpeg/JPG 等大小写组合）都排掉：少写一个后缀，FTP-Deploy-Action 就会把
          # 服务器上这类文件当成「仓库里已删除」清掉——线上 8 张 avatar_<hex>.jpeg
          # 头像就是这么消失的，数据库里至今还留着路径（详见 DEPLOY.md）。
          # 想确认规则是否生效，可以看部署日志里的 exclude 列表，或用 dry-run 跑一次。
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/.dsh-tmp/**
            uploads/classmates/*.jpg
            uploads/classmates/*.jpeg
            uploads/classmates/*.JPG
            uploads/classmates/*.JPEG
            uploads/classmates/*.png
            uploads/classmates/*.PNG
            uploads/classmates/*.webp
            uploads/classmates/*.WEBP
            api/photos/classmates/*.jpg
            api/photos/classmates/*.jpeg
            api/photos/classmates/*.JPG
            api/photos/classmates/*.JPEG
            api/photos/classmates/*.png
            api/photos/classmates/*.PNG
            api/photos/classmates/*.webp
            api/photos/classmates/*.WEBP
            data/*.log
            data/*.json

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ZONE_ID}" ]; then
            echo "Cloudflare secrets not configured, skipping purge"
            exit 0
          fi
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            -o /tmp/cf-purge.json -w "HTTP %{http_code}\n"
          cat /tmp/cf-purge.json

      # 上线后自检：FTP 上传报「成功」并不代表文件真的落到站点根目录
      # （例如往主机自带、FTP 写不进去的目录上传时会被静默跳过）。
      # 这里挑几个关键文件做 HTTP 校验，任何一个不是 200 就把这次部署判为失败。
      - name: Verify deployed files
        run: |
          set -u
          failed=0
          check() {
            label="$1"; url="$2"
            code=000
            attempt=1
            while [ "$attempt" -le 3 ]; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$url") || code=000
              if [ "$code" = "200" ]; then break; fi
              attempt=$((attempt + 1))
              sleep 4
            done
            if [ "$code" = "200" ]; then
              echo "OK   $label  $url"
            else
              echo "::error::$label 部署后校验失败（HTTP $code）：$url"
              failed=1
            fi
          }
          check "错误页样式 error.css"  https://bayabang.top/error-pages/error.css
          check "错误页脚本 error.js"   https://bayabang.top/error-pages/error.js
          check "404 错误页"            https://bayabang.top/error-pages/404.html
          check "后台样式 admin-ui"     https://bayabang.top/css/admin-ui.css
          check "留言板脚本"            https://bayabang.top/js/pages/messages.js
          check "会话接口"              https://bayabang.top/api/session.php
          echo "--- /api/session.php 返回 ---"
          curl -s --max-time 25 https://bayabang.top/api/session.php | head -c 300; echo
          exit "$failed"
